<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tarot - Veuriel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<link rel="stylesheet" href="assets/css/main.css" />
	<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
</head>
<body class="is-preload homepage">

  <!-- Aquí cargamos el menú -->
    <div id="header-wrapper">
        <div id="menu-container"></div>
    </div>

  <!-- Contenido único de la página -->

  <section id="pagina-base" class="wrapper style2">
    <div class="container">

      <div class="row">
        <div class="col-12">

          <section class="box">

            <header>
              <h2>Tarot Express</h2>
              <p>
                Una consulta breve para recibir orientación clara sobre una situación puntual.
              </p>
            </header>

            <span class="image featured tarot-img">
              <img src="images/tarot.jpg" alt="Lectura de tarot">
            </span>

            <p>
              Ideal para momentos donde necesitás claridad rápida o una guía
              para tomar una decisión. La consulta se realiza de forma directa
              y enfocada en tu pregunta.
            </p>

            <a href="https://wa.me/5491136757276?text=Hola! Quiero reservar un Tarot Express"
              class="button icon solid fa-arrow-circle-right tarot-btn"
              target="_blank">
              Reservar Tarot Express
            </a>

          </section>

        </div>
      </div>

    </div>
  </section>



  <!-- Espacio antes del footer -->
  <div style="height:50px;" id="div-html-base">
  </div>

    <!-- Aquí cargamos el footer -->
      <div id="footer-wrapper">   
          <div id="footer-container"></div>
      </div>

    <script>
      // Cargar menú
      fetch('menu.html')
        .then(res => res.text())
        .then(data => {
          document.getElementById('menu-container').innerHTML = data;
        });

      // Cargar footer
      fetch('footer.html')
        .then(res => res.text())
        .then(data => {
          document.getElementById('footer-container').innerHTML = data;
        });
    </script>

    <!-- Scripts -->

		<script src="assets/js/jquery.min.js"></script>
		<script src="assets/js/jquery.dropotron.min.js"></script>
		<script src="assets/js/browser.min.js"></script>
		<script src="assets/js/breakpoints.min.js"></script>
		<script src="assets/js/util.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/jquery.min.js"></script>

    <script>
      $(function () {
        $("#menu-container").load("header.html", function () {

          // scripts del template
          $.getScript("assets/js/jquery.dropotron.min.js");
          $.getScript("assets/js/browser.min.js");
          $.getScript("assets/js/breakpoints.min.js");
          $.getScript("assets/js/util.js");
          $.getScript("assets/js/main.js");

        });
      });
    </script>


</body>
</html>
